name: Publish worker images

on:
  push:
    tags: [ 'v*', 'release-*' ]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push default image (GHCR)
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/transcript-coach-agent:latest -f ./agent/Dockerfile .
          docker push ghcr.io/${{ github.repository_owner }}/transcript-coach-agent:latest

      - name: Build & push cuda129 image (GHCR)
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/transcript-coach-agent:cuda129 -f ./agent/Dockerfile.cuda129 .
          docker push ghcr.io/${{ github.repository_owner }}/transcript-coach-agent:cuda129

      - name: Optionally push to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME && secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          docker tag ghcr.io/${{ github.repository_owner }}/transcript-coach-agent:latest $DOCKERHUB_USERNAME/transcript-coach-agent:latest
          docker push $DOCKERHUB_USERNAME/transcript-coach-agent:latest
