name: Publish worker images

on:
  push:
    tags: [ 'v*', 'release-*' ]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR (use GHCR_TOKEN if set)
        run: |
          # Prefer an explicit PAT with write:packages permission stored in GHCR_TOKEN.
          if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
            echo "Logging in to GHCR with GHCR_TOKEN"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          else
            echo "GHCR_TOKEN not set; attempting login with GITHUB_TOKEN (may be restricted)"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true
          fi

      - name: Build & push default image (GHCR)
        run: |
          # Build using agent/ as the context
          docker build -t ghcr.io/${{ github.repository_owner }}/transcript-coach-agent:latest -f ./agent/Dockerfile ./agent
          # Only push to GHCR if GHCR_TOKEN is provided (safer for orgs where GITHUB_TOKEN lacks package write)
          if [ -z "${{ secrets.GHCR_TOKEN }}" ]; then
            echo "GHCR_TOKEN not provided; skipping push to GHCR. To publish, create a PAT with 'write:packages' (and repo if private) and add it as the GHCR_TOKEN secret."
            echo "See: https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-container-registry"
          else
            docker push ghcr.io/${{ github.repository_owner }}/transcript-coach-agent:latest
          fi

      - name: Build & push cuda129 image (GHCR)
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/transcript-coach-agent:cuda129 -f ./agent/Dockerfile.cuda129 ./agent
          if [ -z "${{ secrets.GHCR_TOKEN }}" ]; then
            echo "GHCR_TOKEN not provided; skipping push to GHCR for cuda129 image."
          else
            docker push ghcr.io/${{ github.repository_owner }}/transcript-coach-agent:cuda129
          fi

      - name: Optionally push to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "Docker Hub credentials not set; skipping push to Docker Hub"
            exit 0
          fi
          echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          docker tag ghcr.io/${{ github.repository_owner }}/transcript-coach-agent:latest $DOCKERHUB_USERNAME/transcript-coach-agent:latest
          docker push $DOCKERHUB_USERNAME/transcript-coach-agent:latest
