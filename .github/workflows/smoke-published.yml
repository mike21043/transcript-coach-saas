name: Smoke test published images

on:
  workflow_dispatch: {}

jobs:
  smoke_published:
    name: Smoke published images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (needed for workspace path)
        uses: actions/checkout@v4

      - name: Ensure Docker available
        run: docker version

      - name: Pull and run smoke for latest
        run: |
          set -euo pipefail
          IMG=ghcr.io/mike21043/transcript-coach-agent:latest
          echo "Pulling $IMG"
          docker pull "$IMG"
          mkdir -p "$RUNNER_TEMP/smoke_latest"
          echo "Running smoke for $IMG"
          docker run --rm -e AGENT_SMOKE=1 -v "$RUNNER_TEMP/smoke_latest":/data/results "$IMG"
          echo "Contents of smoke dir:"; ls -la "$RUNNER_TEMP/smoke_latest" || true
          echo "Smoke JSON:"; cat "$RUNNER_TEMP/smoke_latest/smoke_result.json"

      - name: Pull and run smoke for cuda129
        run: |
          set -euo pipefail
          IMG=ghcr.io/mike21043/transcript-coach-agent:cuda129
          echo "Pulling $IMG"
          docker pull "$IMG"
          mkdir -p "$RUNNER_TEMP/smoke_cuda129"
          echo "Running smoke for $IMG"
          docker run --rm -e AGENT_SMOKE=1 -v "$RUNNER_TEMP/smoke_cuda129":/data/results "$IMG"
          echo "Contents of smoke dir:"; ls -la "$RUNNER_TEMP/smoke_cuda129" || true
          echo "Smoke JSON:"; cat "$RUNNER_TEMP/smoke_cuda129/smoke_result.json"

      - name: Validate JSONs
        run: |
          set -euo pipefail
          jq -e . "$RUNNER_TEMP/smoke_latest/smoke_result.json" >/dev/null
          jq -e . "$RUNNER_TEMP/smoke_cuda129/smoke_result.json" >/dev/null
          echo "Both smoke_result.json files are valid JSON."
name: Smoke Published Images

on:
  workflow_dispatch:
    inputs:
      owner:
        description: 'GitHub owner/org (defaults to repository owner)'
        required: false
      tag:
        description: 'Image tag to test (e.g. cuda129 or latest)'
        required: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
name: Smoke test published images

on:
  workflow_dispatch: {}

jobs:
  smoke_published_images:
    name: Smoke published images (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Docker is available
        run: docker version

      - name: Login to GHCR (optional)
        if: ${{ secrets.GHCR_TOKEN != '' }}
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Create docker network for smoke test
        run: |
          set -euo pipefail
          docker network create smoke-net || true

      - name: Start redis on smoke-net
        run: |
          set -euo pipefail
          docker run -d --rm --name smoke-redis --network smoke-net redis:7

      - name: Smoke test latest image
        run: |
          set -euo pipefail
          IMG=ghcr.io/mike21043/transcript-coach-agent:latest
          echo "Pulling $IMG"
          docker pull "$IMG"
          echo "Running $IMG on smoke-net"
          docker run --rm --name smoke-latest --network smoke-net -e AGENT_SMOKE=1 -e REDIS_URL=redis://smoke-redis:6379/0 "$IMG"
          echo "Querying redis for result key..."
          docker run --rm --network smoke-net redis:7 redis-cli -h smoke-redis -p 6379 GET result:smoke || (echo "Result missing for latest" && exit 1)

      - name: Smoke test cuda129 image
        run: |
          set -euo pipefail
          IMG=ghcr.io/mike21043/transcript-coach-agent:cuda129
          echo "Pulling $IMG"
          docker pull "$IMG"
          echo "Running $IMG on smoke-net"
          docker run --rm --name smoke-cuda --network smoke-net -e AGENT_SMOKE=1 -e REDIS_URL=redis://smoke-redis:6379/0 "$IMG"
          echo "Querying redis for result key..."
          docker run --rm --network smoke-net redis:7 redis-cli -h smoke-redis -p 6379 GET result:smoke || (echo "Result missing for cuda129" && exit 1)

      - name: Cleanup smoke network
        if: always()
        run: |
          docker rm -f smoke-redis || true
          docker network rm smoke-net || true

      - name: Success
        run: echo "Smoke tests passed for both images"
